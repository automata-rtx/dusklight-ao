name: Build

on:
  # Manual trigger. GitHub occasionally drops push events entirely during an
  # Actions backlog rather than merely delaying them - on 2026-08-06 three
  # consecutive pushes to a claude/** branch produced no run at all, hours
  # apart, while other repos in the org were scheduling normally. Without a
  # dispatch there is no way to recover from that except pushing again and
  # hoping, and the artifact this workflow produces is how the game gets tested.
  workflow_dispatch:
  push:
    paths-ignore:
      - '*.md'
      - '*LICENSE'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '*.md'
      - '*LICENSE'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  # The GitHub Actions cache backend occasionally fails to resolve mid-run
  # ("dns error: failed to lookup address information"), which otherwise fails
  # sccache server startup and so fails every compile in the job. Fall back to
  # invoking the compiler directly instead of failing the build.
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

# WINDOWS x86_64 ONLY ON THIS LINE (2026-08-14, owner's instruction). A build we put out
# for Remix/DX9 is Windows x86_64, so that is the only job left active: build-linux,
# build-apple and build-android are switched off below, and the Windows matrix has been
# cut to its MSVC x86_64 entry.
#
# Switched off with `if: ${{ false }}` rather than deleted or commented out, on purpose.
# The jobs stay in the file, keep being parsed, and show up as skipped rather than
# vanishing - so nobody has to reconstruct 150 lines of Apple and Android setup to get
# them back, and the diff that turns one back on is one line. This lineage does not ship
# those platforms; it does not follow that the recipes for them should be thrown away.
#
# The Invariants workflow is untouched - it is a check, not a build, it runs in seconds,
# and CLAUDE.md is explicit that doc-only commits are exactly when it earns its place.

jobs:
  build-linux:
    # See the note above jobs:. Delete this line to re-enable.
    if: ${{ false }}
    name: Build Linux (${{matrix.name}})
    runs-on: ${{matrix.runner}}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC x86_64
            runner: ubuntu-24.04
            preset: gcc
            artifact_arch: x86_64
          - name: GCC aarch64
            runner: ubuntu-24.04-arm
            preset: gcc
            artifact_arch: aarch64
          # - name: Clang x86_64
          #   runner: ubuntu-latest
          #   preset: clang
          #   artifact_arch: x86_64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build clang lld mold openssl libcurl4-openssl-dev \
            zlib1g-dev libglu1-mesa-dev libdbus-1-dev libvulkan-dev libxi-dev libxrandr-dev libasound2-dev \
            libpulse-dev libudev-dev libpng-dev libncurses5-dev libx11-xcb-dev libfreetype-dev \
            libxinerama-dev libxcursor-dev python3-markupsafe libgtk-3-dev libssl-dev \
            libxss-dev libfuse2 libusb-1.0-0-dev libdecor-0-dev libpipewire-0.3-dev libunwind-dev

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Print sccache stats
        run: sccache --show-stats

      - name: Configure CMake
        run: cmake --preset x-linux-ci-${{matrix.preset}}

      - name: Build
        run: cmake --build --preset x-linux-ci-${{matrix.preset}}

      - name: Generate AppImage
        run: ci/build-appimage.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.DUSK_VERSION}}-linux-${{matrix.preset}}-${{matrix.artifact_arch}}
          path: |
            build/install/Dusklight-*.AppImage
            build/install/debug.tar.*
            build/install/sdk/

  build-apple:
    # See the note above jobs:. Delete this line to re-enable.
    if: ${{ false }}
    name: Build Apple (${{matrix.name}})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AppleClang macOS arm64
            platform: macos
            preset: x-macos-ci-arm64
            artifact_name: macos-appleclang-arm64
          - name: AppleClang macOS x86_64
            platform: macos
            preset: x-macos-ci-x86_64
            artifact_name: macos-appleclang-x86_64
          - name: AppleClang iOS arm64
            platform: ios
            preset: x-ios-ci
            artifact_name: ios-appleclang-arm64
          # - name: AppleClang tvOS arm64
          #   platform: tvos
          #   preset: x-tvos-ci
          #   artifact_name: tvos-appleclang-arm64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Install Rust iOS target
        if: matrix.platform == 'ios'
        run: |
          rustup toolchain install stable
          rustup target add aarch64-apple-ios

      - name: Install Rust tvOS target
        if: matrix.platform == 'tvos'
        run: |
          rustup toolchain install nightly
          rustup target add --toolchain nightly aarch64-apple-tvos

      - name: Install Rust x86_64 macOS target
        if: endsWith(matrix.preset, 'x86_64')
        run: |
          rustup toolchain install stable
          rustup target add x86_64-apple-darwin

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: cmake --preset ${{matrix.preset}}

      - name: Build
        run: cmake --build --preset ${{matrix.preset}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.DUSK_VERSION}}-${{matrix.artifact_name}}
          path: |
            build/install/Dusklight.app
            build/install/debug.tar.*
            build/install/sdk/

  build-android:
    # See the note above jobs:. Delete this line to re-enable.
    if: ${{ false }}
    name: Build Android (${{matrix.name}})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clang arm64-v8a
            preset: x-android-ci-arm64
            abi: arm64-v8a
            artifact_arch: arm64
            rust_target: aarch64-linux-android

    env:
      ANDROID_NDK_VERSION: "29.0.14206865"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Install Rust Android target
        run: |
          rustup toolchain install stable
          rustup target add ${{matrix.rust_target}}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: cmake --preset ${{matrix.preset}}

      - name: Build native library
        run: cmake --build --preset ${{matrix.preset}} --target dusklight

      - name: Build bundled mods
        run: cmake --build --preset ${{matrix.preset}} --target dusklight_mods

      - name: Stage stripped JNI library
        run: ANDROID_STAGE_ABIS="${{matrix.abi}}" platforms/android/scripts/stage-jni-libs.sh

      - name: Build APK
        working-directory: platforms/android
        run: ./gradlew :app:assembleRelease --rerun-tasks

      - name: Stage artifacts
        run: |
          mkdir -p upload/sdk
          cp build/*/stub-android-*.so upload/sdk/
          cp platforms/android/app/build/outputs/apk/release/app-${{matrix.abi}}-release-unsigned.apk upload/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.DUSK_VERSION}}-android-${{matrix.artifact_arch}}
          path: upload/

  build-windows:
    name: Build Windows (${{matrix.name}})
    runs-on: ${{matrix.runner}}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC x86_64
            runner: windows-latest
            preset: msvc
            msvc_arch: amd64
            vcpkg_arch: x64
            artifact_arch: x86_64
          # arm64 removed from the matrix 2026-08-14 (owner's instruction: Remix/DX9
          # builds are Windows x86_64). It had a second, independent cost that CLAUDE.md
          # already records: it is the scarce runner, and on 2026-08-06 it sat 15 minutes
          # with no runner assigned, executed zero steps and was cancelled - which makes
          # the whole run read "failure" while the x86_64 artifact beside it was fine.
          # That misreading cost time twice.
          # - name: MSVC arm64
          #   runner: windows-latest
          #   preset: arm64-msvc
          #   msvc_arch: amd64_arm64
          #   vcpkg_arch: arm64
          #   artifact_arch: arm64
          # - name: Clang x86_64
          #   runner: windows-latest
          #   preset: clang
          #   msvc_arch: amd64
          #   vcpkg_arch: x64
          #   artifact_arch: x86_64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Enable Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.msvc_arch}}

      # msvc-dev-cmd sets VCPKG_ROOT, set it back
      - name: Override VCPKG_ROOT
        run: echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Persist the source tarballs vcpkg downloads. When the binary cache
      # misses (a compiler update changes every package ABI, for example)
      # vcpkg otherwise has to re-fetch sources from their upstream hosts, and
      # an outage there fails the build outright - freetype's host,
      # gitlab.freedesktop.org, returned 504 for every attempt on 2026-07-26
      # and took two builds down before a line of our code was compiled.
      # A restored tarball is reused without any network access.
      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\downloads
          key: vcpkg-downloads-${{runner.os}}-${{matrix.vcpkg_arch}}-freetype-zstd
          restore-keys: |
            vcpkg-downloads-${{runner.os}}-${{matrix.vcpkg_arch}}-
            vcpkg-downloads-${{runner.os}}-

      - name: Install dependencies
        run: |
          choco install ninja
          # vcpkg source downloads occasionally fail on hosted runners:
          # transient TLS failures (curl error 35), or an upstream source host
          # being down (curl 504). vcpkg treats either as fatal.
          # Retrying is safe: already-installed ports are skipped.
          $attempts = 0
          do {
            vcpkg install freetype:${{matrix.vcpkg_arch}}-windows zstd:${{matrix.vcpkg_arch}}-windows
            if ($LASTEXITCODE -eq 0) { break }
            $attempts++
            if ($attempts -ge 3) { exit 1 }
            Write-Host "vcpkg install failed (attempt $attempts of 3); retrying in 20s..."
            Start-Sleep -Seconds 20
          } while ($true)

      - name: Configure CMake
        run: cmake --preset x-windows-ci-${{matrix.preset}}

      - name: Build
        run: cmake --build --preset x-windows-ci-${{matrix.preset}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.DUSK_VERSION}}-win32-msvc-${{matrix.artifact_arch}}
          path: |
            build/install/*.exe
            build/install/*.dll
            build/install/*.symdb
            build/install/res/
            build/install/mods/
            build/install/debug.7z
            build/install/sdk/
